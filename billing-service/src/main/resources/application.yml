spring:
  application:
    name: billing-service
  datasource:
    url: ${BILLING_DB_URL:jdbc:postgresql://localhost:5432/billingdb}
    username: ${BILLING_DB_USER:billing_app}
    password: ${BILLING_DB_PASSWORD:billing_app}
  flyway:
    enabled: true
    schemas: billing
    default-schema: billing
    create-schemas: true

server:
  port: ${BILLING_PORT:8083}

billing:
  # Hungarian standard rate. Frozen onto each invoice when it is issued.
  vat-rate: 0.27
  stripe:
    # No real key exists for this project. Point api-base at stripe/stripe-mock (compose),
    # stripe-sim (local) or https://api.stripe.com, and drop in an sk_test_... key to talk to
    # Stripe for real. Nothing else in the code has to change.
    #
    # The key must be alphanumeric after the sk_test_ prefix: stripe-mock validates the shape and
    # rejects anything with an underscore in the body ("Please authenticate by specifying an
    # Authorization header with any valid looking testmode secret API key").
    api-key: ${STRIPE_API_KEY:sk_test_mclsaat123}
    api-base: ${STRIPE_API_BASE:http://localhost:12111}
  batch:
    # The clearing-house file exchange. Under docker compose these three live on a shared volume.
    outbox-dir: ${BATCH_OUTBOX_DIR:batch-exchange/outbox}
    inbox-dir: ${BATCH_INBOX_DIR:batch-exchange/inbox}
    archive-dir: ${BATCH_ARCHIVE_DIR:batch-exchange/archive}
    # How often the inbox is swept for acknowledgement files.
    poll-interval-ms: ${BATCH_POLL_INTERVAL_MS:2000}
    # The nightly-style export. Off by default so the demo decides when a batch is cut; a real
    # deployment would run it on a cron.
    auto-export-enabled: ${BATCH_AUTO_EXPORT:false}
    auto-export-interval-ms: ${BATCH_AUTO_EXPORT_INTERVAL_MS:60000}
    # A batch sent longer ago than this and still unacknowledged is reported to ops. Deliberately
    # short so the failure branch is demonstrable in a two-minute demo rather than overnight.
    unconfirmed-after-minutes: ${BATCH_UNCONFIRMED_AFTER_MINUTES:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    hu.mclsaat.legacy: INFO
